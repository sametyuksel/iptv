# IPTV Nexus — global settings.
# Every value here has a built-in default (see src/core/config.ts); this file
# only needs to contain what you want to change.

project:
  name: IPTV Nexus
  short_name: Nexus
  description: Self-updating IPTV channel, stream and EPG index with a free static API.
  # Set this to your Pages URL, e.g. https://username.github.io/iptv-nexus
  # CI overrides it automatically via the NEXUS_BASE_URL environment variable.
  base_url: https://sametyuksel.github.io/iptv
  repository: https://github.com/sametyuksel/iptv

aggregate:
  upstream_api: https://iptv-org.github.io/api
  upstream_mirror: https://raw.githubusercontent.com/iptv-org/api/gh-pages
  cache_ttl_minutes: 60
  respect_blocklist: true
  # Set to false if you want adult channels included in the output.
  exclude_nsfw: true
  max_streams_per_channel: 8
  http_concurrency: 12

health:
  enabled: true
  # 40 parallel probes is comfortable on a GitHub-hosted runner.
  concurrency: 40
  timeout_seconds: 12
  # Weight of the newest observation in the rolling score. Higher reacts faster
  # to outages but is noisier; 0.3 needs roughly 3 bad scans to condemn a stream.
  score_alpha: 0.3
  retire_after_failures: 10
  history_size: 30
  healthy_threshold: 40
  use_ffprobe: true
  probe_duration: 4

epg:
  enabled: true
  days: 3
  retain_past_hours: 6
  concurrency: 6
  # Below this fuzzy score an EPG channel is left unmatched rather than guessed.
  match_threshold: 0.86
  gzip: true

discovery:
  enabled: true
  concurrency: 20
  require_online: true
  require_channel_match: true
  match_threshold: 0.9
  max_accepted_per_run: 250

api:
  gzip: true
  pretty: false
  shards: true
  # playable | all | false — per-channel JSON documents.
  # `all` emits ~40k files (~300 MB); `playable` emits only channels with streams.
  channel_details: playable
  include_offline: true

playlists:
  # category | country | language — controls the group-title in generated M3Us.
  group_by: category
  min_score: 0
  link_epg: true
