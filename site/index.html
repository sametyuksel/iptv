<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Frekans TV</title>
    <meta
      name="description"
      content="Frekans TV, kamuya açık IPTV kanallarını sağlık skoru ve yayın akışıyla izlemek için yerel bir oynatıcıdır."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#090a0d" />
    <meta property="og:title" content="Frekans TV" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Kanalları ara, sağlığını gör, yayını tarayıcıda aç." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090a0d'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23f3efe6' stroke-width='2' opacity='.5'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23ffb020'/%3E%3Cpath d='M32 32 L46 20' stroke='%23ffb020' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  </head>
  <body>
    <a class="skip-link" href="#results">Kanallara geç</a>

    <header class="topbar">
      <div class="topbar__inner">
        <div class="brand">
          <svg class="brand__mark" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.45" />
            <path d="M32 12 v5 M32 47 v5 M12 32 h5 M47 32 h5" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7" />
            <circle cx="32" cy="32" r="3" fill="#ffb020" />
            <path d="M32 32 L46 20" stroke="#ffb020" stroke-width="2" stroke-linecap="round" />
          </svg>
          <div class="brand__lockup">
            <span class="brand__name">Frekans</span>
            <span class="brand__tv">TV</span>
            <span class="brand__meta" id="brand-meta">yükleniyor…</span>
          </div>
        </div>

        <div class="search">
          <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input id="search" type="search" placeholder="Kanal ara" autocomplete="off" spellcheck="false" aria-label="Kanal ara" />
          <kbd class="search__kbd">/</kbd>
        </div>

        <div class="topbar__actions">
          <time id="clock"></time>
          <button id="filters-toggle" class="btn btn--ghost" aria-expanded="false" aria-controls="filters">
            Süzgeç <span class="badge" id="filter-count" hidden>0</span>
          </button>
          <a class="btn btn--ghost" href="api/v1/openapi.json" target="_blank" rel="noopener">API</a>
          <button id="theme-toggle" class="btn btn--icon" title="Temayı değiştir" aria-label="Temayı değiştir">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="layout">
      <aside class="filters" id="filters" aria-label="Süzgeçler">
        <div class="filters__group">
          <label class="switch">
            <input type="checkbox" id="filter-playable" checked />
            <span></span>
            Yayını olan
          </label>
          <label class="switch">
            <input type="checkbox" id="filter-online" />
            <span></span>
            Şu an çalışan
          </label>
          <label class="switch">
            <input type="checkbox" id="filter-hd" />
            <span></span>
            HD ve üzeri
          </label>
          <label class="switch">
            <input type="checkbox" id="filter-favorites" />
            <span></span>
            Favoriler
          </label>
        </div>

        <div class="filters__group">
          <label class="field">
            <span class="field__label">Ülke</span>
            <select id="filter-country"><option value="">Tüm ülkeler</option></select>
          </label>
          <label class="field">
            <span class="field__label">Tür</span>
            <select id="filter-category"><option value="">Tüm türler</option></select>
          </label>
          <label class="field">
            <span class="field__label">Dil</span>
            <select id="filter-language"><option value="">Tüm diller</option></select>
          </label>
          <label class="field">
            <span class="field__label">Sırala</span>
            <select id="sort">
              <option value="relevance">Uygunluk</option>
              <option value="score">Sağlık skoru</option>
              <option value="name">Ad</option>
              <option value="quality">Kalite</option>
            </select>
          </label>
        </div>

        <button id="filters-reset" class="btn btn--ghost btn--block">Süzgeçleri temizle</button>
        <div class="filters__stats" id="stats"></div>
      </aside>

      <section class="content">
        <div class="content__head">
          <h1 id="list-title">Kanallar</h1>
          <p id="result-count" class="muted" role="status" aria-live="polite">Kanallar yükleniyor…</p>
          <div class="chips" id="active-chips"></div>
        </div>
        <div id="results" class="grid" tabindex="-1"></div>
        <div id="sentinel" class="sentinel" aria-hidden="true"></div>
        <p id="empty" class="empty" hidden>
          Bu süzgeçle kanal yok.<br />
          <button class="btn btn--ghost" id="empty-reset" type="button">Süzgeçleri temizle</button>
        </p>
      </section>
    </main>

    <div class="player" id="player" hidden aria-modal="true" role="dialog" aria-labelledby="player-title">
      <div class="player__backdrop" data-close></div>
      <div class="player__panel">
        <header class="player__head">
          <span id="player-fallback" class="player__fallback" hidden></span>
          <img id="player-logo" class="player__logo" alt="" hidden />
          <div class="player__titles">
            <h2 id="player-title">Kanal</h2>
            <p id="player-sub" class="muted"></p>
          </div>
          <button class="btn btn--icon" id="player-fav" title="Favorilere ekle" aria-label="Favorilere ekle" aria-pressed="false">★</button>
          <button class="btn btn--ghost" data-close type="button">Kanallar</button>
        </header>

        <div class="player__video">
          <video id="video" controls playsinline preload="none"></video>
          <div class="player__overlay" id="player-status" hidden></div>
        </div>

        <div class="player__body">
          <p class="hint">↑↓ başka kanala geçer · Esc kapatır</p>
          <div class="player__streams" id="player-streams"></div>
          <div class="player__epg" id="player-epg"></div>
          <details class="player__meta">
            <summary>Teknik ayrıntı</summary>
            <dl id="player-meta"></dl>
          </details>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p>
        <strong>Frekans TV</strong> video barındırmaz ve yayını yeniden iletmez. Kanallar kamuya açık
        adreslerden, tarayıcınızda açılır.
      </p>
      <p class="muted" id="footer-meta"></p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js" referrerpolicy="no-referrer"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
